# Deploy to GitHub Pages (free) on every push to main.
# Requires Pages enabled with source "GitHub Actions" (repo Settings → Pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Bot + admin là thông tin công khai (link bot và handle Telegram của chị)
      # nên để thẳng ở đây; không có secret nào trong workflow này.
      - run: npm run build
        env:
          VITE_BOT_USERNAME: nienkhaitocam_khophimvietsub_bot
          VITE_ADMIN_USERNAME: nhatlosinhhoa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
